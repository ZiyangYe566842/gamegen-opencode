<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Generated Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="hud-title">Generated Game</div>
        <div class="hud-stats">
          <span id="score">Score: 0</span><span id="status">Ready</span>
        </div>
      </div>
      <canvas id="game" width="960" height="540"></canvas>
      <div id="controls">
        <button id="startBtn">Start / Restart</button>
        <p>Use arrow keys or WASD. Space / click for action.</p>
      </div>
    </div>
  </body>
</html>
